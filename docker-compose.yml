services:
  app:
    build: .
    container_name: baby-app
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      PORT: "8888"
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      XIAOAI_BASE_URL: ${XIAOAI_BASE_URL:-http://192.168.60.142:9092}
      XIAOAI_TIMEOUT_MS: ${XIAOAI_TIMEOUT_MS:-60000}
      XIAOAI_BLOCKING: ${XIAOAI_BLOCKING:-false}
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-30}
      REMINDER_ENABLED: ${REMINDER_ENABLED:-true}
